<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOR LIL AI - by RIFINYO SOUFIANE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:800px;display:flex;flex-direction:column;height:100vh;background:#111;border-left:1px solid #222;border-right:1px solid #222}
.header{background:#000;padding:18px;text-align:center;border-bottom:1px solid #222}
.header h1{font-size:22px;background:linear-gradient(90deg,#00ff88,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:12px;color:#888;margin-top:5px}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.msg{padding:14px 18px;border-radius:20px;max-width:85%;line-height:1.6;white-space:pre-wrap}
.user{background:#00ff88;color:#000;align-self:flex-end;border-bottom-right-radius:6px}
.ai{background:#1e1e1e;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:6px}
.typing{display:none;padding:10px 20px;color:#00ff88;font-size:13px}
.input-box{display:flex;padding:15px;background:#000;border-top:1px solid #222;gap:10px}
#msg{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:30px;padding:14px 20px;color:#fff;outline:none}
#msg:focus{border-color:#00ff88}
#send{background:#00ff88;border:none;width:50px;height:50px;border-radius:50%;cursor:pointer;font-size:20px;transition:.2s}
#send:hover{transform:scale(1.1)}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>🤖 MOR LIL AI</h1>
<p>Created by RIFINYO SOUFIANE - يجاوب بكل اللغات و دغيا</p>
</div>
<div id="chat">
<div class="msg ai">مرحبا! أنا MOR LIL 😎 الذكاء الاصطناعي ديال RIFINYO SOUFIANE.
كنجاوب بكل اللغات، سولني أي حاجة: برمجة، دراسة، VPS، حب، دين، أي حاجة!</div>
</div>
<div class="typing" id="typing">MOR LIL كيكتب... ⏳</div>
<div class="input-box">
<input id="msg" placeholder="كتب سؤالك هنا..." onkeypress="if(event.key==='Enter')sendMsg()">
<button id="send" onclick="sendMsg()">➤</button>
</div>
</div>
<script>
const API = "http://8.219.249.135:3000/chat";

async function sendMsg(){
 let input = document.getElementById('msg');
 let text = input.value.trim();
 if(!text) return;
 let chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg user">${text}</div>`;
 input.value = "";
 chat.scrollTop = chat.scrollHeight;
 document.getElementById('typing').style.display = "block";

 try{
  let res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message:text})
  });
  let data = await res.json();
  document.getElementById('typing').style.display = "none";
  chat.innerHTML += `<div class="msg ai">${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
 }catch(e){
  document.getElementById('typing').style.display = "none";
  chat.innerHTML += `<div class="msg ai" style="color:#ff5555">❌ الـ VPS طافي، دير فالـ VPS: nohup python3 app.py &</div>`;
 }
}
</script>
</div>
</body>
</html>
